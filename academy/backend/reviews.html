<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZER0LIFE Academy | Student Reviews</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top right,#251c45,transparent 60%),#090a12;color:#f5f4ff;font:16px/1.65 system-ui}main{max-width:800px;margin:auto;padding:28px 20px}header{display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between}a{color:#c6baff}select{background:#171827;color:white;padding:8px;border-radius:8px}h1{font-size:clamp(32px,6vw,56px);line-height:1.1}article{background:#141522;border:1px solid #343148;border-radius:18px;padding:20px;margin:14px 0}p{white-space:pre-wrap;overflow-wrap:anywhere}small,#note{color:#a4a7bc}.stars{color:#d7b875;letter-spacing:3px}.metric{font-size:36px;font-weight:700;color:#c6baff}</style></head><body><main><header><b>ZER0LIFE / ACADEMY</b><a href="/dashboard" id="back">Academy</a><select id="lang" aria-label="Language"><option value="en">English</option><option value="ru">Русский</option><option value="uk">Українська</option><option value="pl">Polski</option></select></header><h1 id="title">Student reviews</h1><p id="note"></p><div class="metric" id="rating"></div><p id="count"></p><div id="items" aria-live="polite"></div></main><script>
const words={en:["Student reviews","Reviews by paid students. Published anonymously with consent. Positive and negative experiences are welcome.","Academy","reviews","No reviews yet.","Verified paid student","Reviews unavailable."],ru:["Отзывы студентов","Отзывы оплативших курс студентов. Публикуются анонимно с согласия автора. Приветствуются как положительные, так и отрицательные отзывы.","Академия","отзывов","Пока нет отзывов.","Подтверждённая оплата курса","Отзывы недоступны."],uk:["Відгуки студентів","Відгуки студентів, які оплатили курс. Публікуються анонімно за згодою автора. Вітаємо позитивні й негативні відгуки.","Академія","відгуків","Відгуків поки немає.","Підтверджена оплата курсу","Відгуки недоступні."],pl:["Opinie studentów","Opinie osób, które opłaciły kurs. Publikowane anonimowo za zgodą autora. Mile widziane są pozytywne i negatywne opinie.","Akademia","opinii","Brak opinii.","Potwierdzona płatność za kurs","Opinie niedostępne."]};let data=null;let failed=false;
function render(){const lang=document.getElementById("lang").value,w=words[lang];document.documentElement.lang=lang;document.getElementById("title").textContent=w[0];document.getElementById("note").textContent=w[1];document.getElementById("back").textContent=w[2];const root=document.getElementById("items");root.replaceChildren();document.getElementById("rating").textContent=data&&data.average!==null?data.average+" / 5":"";document.getElementById("count").textContent=data?data.count+" "+w[3]:"";if(failed||data&&!data.items.length){root.textContent=failed?w[6]:w[4];return}if(!data)return;for(const v of data.items){const a=document.createElement("article"),s=document.createElement("div"),p=document.createElement("p"),m=document.createElement("small");s.className="stars";s.textContent="★".repeat(v.rating)+"☆".repeat(5-v.rating);s.setAttribute("aria-label",v.rating+" / 5");p.textContent=v.body;m.textContent=w[5]+" · "+v.date;a.append(s,p,m);root.append(a)}}
document.getElementById("lang").onchange=render;render();fetch("/reviews/public",{cache:"no-store"}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{data=d;render()}).catch(()=>{failed=true;render()});
</script></body></html>
