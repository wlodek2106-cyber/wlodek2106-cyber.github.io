<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ZER0LIFE · AI Production Cost Calculator</title><style>*{box-sizing:border-box}body{margin:0;background:#090a12;color:#efedff;font:16px/1.5 system-ui}main{max-width:960px;margin:auto;padding:24px 16px 60px}nav{display:flex;gap:16px;flex-wrap:wrap;align-items:center}a{color:#c7b6ff}section{background:#151624;border:1px solid #37354b;border-radius:16px;padding:20px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}label{display:block}input,textarea,select,button{font:inherit;padding:10px;border-radius:10px;min-height:44px}input,textarea{width:100%;background:#0d0f1b;color:#fff;border:1px solid #525269}button{background:#c7b6ff;color:#191229;border:0;font-weight:700}button:disabled{opacity:.5}p{color:#c5c4d6}dl{display:grid;grid-template-columns:1fr auto;gap:12px}dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}dt:nth-of-type(5),dd:nth-of-type(5){font-size:1.2em;color:#c7b6ff;font-weight:bold}textarea{margin:12px 0}#error{color:#ffb6a6}</style></head><body><main><nav><strong>ZER0LIFE / CREATOR BUSINESS</strong><a id="nav0" href="/dashboard">Academy</a><a id="nav1" href="/creator-suite">Creator Suite</a><a id="nav2" href="/marketplace">Marketplace</a><select id="lang" aria-label="Language"><option value="en">English</option><option value="ru">Русский</option><option value="uk">Українська</option><option value="pl">Polski</option></select></nav><h1 id="title"></h1><p id="intro"></p><section class="grid" id="fields"></section><section><p id="error" role="alert" hidden></p><dl id="results" aria-live="polite"></dl><p id="notice"></p><textarea id="estimate" readonly rows="9" aria-label="Estimate"></textarea><button id="copy" type="button"></button><p id="status" role="status"></p></section><section><h2 id="proposalTitle"></h2><p id="proposalNotice"></p><div class="grid"><div><label for="projectTitle"></label><input id="projectTitle" maxlength="160"></div><div><label for="clientName"></label><input id="clientName" maxlength="160"></div><div><label for="due"></label><input type="date" id="due"></div><div><label for="revisions"></label><input type="number" id="revisions" min="0" max="20" step="1" value="2"></div><div><label for="advance"></label><input type="number" id="advance" min="0" max="100" step="1" value="50"></div></div><label for="scope"></label><textarea id="scope" rows="4" maxlength="3000"></textarea><label for="extraTerms"></label><textarea id="extraTerms" rows="3" maxlength="2000"></textarea><p id="proposalError" role="status"></p><textarea id="clientProposal" aria-label="Client proposal" readonly rows="12"></textarea><button type="button" id="proposalCopy" disabled></button><p id="proposalStatus" role="status"></p></section></main><script src="/production-cost.js"></script></body></html>
