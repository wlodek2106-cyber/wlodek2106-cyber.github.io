<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src blob: data:; connect-src 'none'; base-uri 'none'; form-action 'none'"><title>ZER0LIFE · Design Studio</title><style>*{box-sizing:border-box}body{margin:0;background:#090a12;color:#efedff;font:16px/1.55 system-ui}main{max-width:1250px;margin:auto;padding:24px 16px 60px}header{display:flex;gap:16px;align-items:center;flex-wrap:wrap}a{color:#c7b6ff}h1{font-size:clamp(32px,6vw,54px);line-height:1.1}p,small{color:#b9b9cf}.workspace{display:grid;grid-template-columns:minmax(250px,340px) minmax(0,1fr);gap:16px;align-items:start}section{background:#151624;border:1px solid #37354b;border-radius:18px;padding:16px}label{display:block;margin:9px 0}input,textarea,select,button{font:inherit;min-height:44px;padding:8px;border-radius:8px;max-width:100%}input,textarea,select{background:#0d0f1b;color:#eee;border:1px solid #44445a}label input,label textarea,label select{display:block;width:100%;margin-top:4px}input[type=color]{padding:4px}button{background:#b5a4ff;color:#171229;border:0;font-weight:700;margin:5px 4px 5px 0;cursor:pointer}button:disabled{opacity:.5}canvas{display:block;max-width:100%;width:auto;height:auto;max-height:75vh;margin:auto;box-shadow:0 12px 35px #0008}.colors{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.preview{position:sticky;top:12px}@media(max-width:760px){.workspace{grid-template-columns:1fr}.preview{position:static}}</style></head><body><main><header><strong>ZER0LIFE / DESIGN</strong><a href="/dashboard">Academy</a><a href="/creator-suite">Creator Suite</a><select id="lang" aria-label="Language"><option value="en">English</option><option value="ru">Русский</option><option value="uk">Українська</option><option value="pl">Polski</option></select></header><h1 data-t="0"></h1><p data-t="1"></p><div class="workspace"><section><label><span data-t="2"></span><select id="size"><option value="square" data-t="19"></option><option value="story" data-t="20"></option><option value="banner" data-t="21"></option><option value="thumbnail" data-t="22"></option><option value="poster" data-t="23"></option></select></label><label><span data-t="3"></span><select id="layout"><option value="gradient" data-t="24"></option><option value="split" data-t="25"></option><option value="minimal" data-t="26"></option></select></label><label><span data-t="4"></span><textarea id="headline" maxlength="120" rows="3"></textarea></label><label><span data-t="5"></span><textarea id="subtitle" maxlength="240" rows="3"></textarea></label><label><span data-t="6"></span><input id="brand" maxlength="60"></label><label><span data-t="7"></span><input id="cta" maxlength="60"></label><div class="colors"><label><span data-t="8"></span><input id="bg" type="color"></label><label><span data-t="9"></span><input id="accent" type="color"></label><label><span data-t="10"></span><input id="fg" type="color"></label></div><label><span data-t="11"></span><input id="font" type="range" min="5" max="16" step="1"></label><label><span data-t="12"></span><input id="photo" type="file" accept="image/png,image/jpeg,image/webp"></label><label><span data-t="13"></span><input id="opacity" type="range" min="0" max="100"></label><button id="removePhoto" data-t="14"></button><button id="reset" data-t="15"></button></section><section class="preview"><canvas id="canvas" aria-label="Design preview"></canvas><p id="dimensions"></p><button id="png" data-t="16"></button><button id="save" data-t="17"></button><label><span data-t="18"></span><input id="load" type="file" accept=".json,application/json"></label><p id="status" role="status"></p><small data-t="30"></small><p><small data-t="31"></small></p></section></div></main><script src="/design-studio.js"></script></body></html>
