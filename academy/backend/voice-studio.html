<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src 'none'; base-uri 'none'; form-action 'none'"><title>ZER0LIFE · AI Voice Studio</title><style>*{box-sizing:border-box}body{margin:0;background:#090a12;color:#efedff;font:16px/1.55 system-ui}main{max-width:920px;margin:auto;padding:24px 18px 70px}header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}h1{font-size:clamp(32px,6vw,54px);line-height:1.1}section{background:#151624;border:1px solid #37354b;border-radius:18px;padding:20px;margin:16px 0}p,small{color:#b9b9cf}a{color:#c7b6ff}label{display:block;margin:8px 0}input,textarea,select,button{font:inherit;min-height:44px;padding:10px;border-radius:10px;max-width:100%}input,textarea,select{background:#0d0f1b;color:#eee;border:1px solid #44445a}label input,label textarea,label select{display:block;width:100%;margin-top:4px}button{background:#b5a4ff;color:#171229;border:0;font-weight:700;margin:6px 6px 6px 0;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#090a12;padding:10px;border-radius:10px}article{border-bottom:1px solid #37354b;padding:10px 0}</style></head><body><main><header><strong>ZER0LIFE / VOICE</strong><a href="/dashboard">Academy</a><a href="/local-media" data-t="audio"></a><select id="lang" aria-label="Language"><option value="en">English</option><option value="ru">Русский</option><option value="uk">Українська</option><option value="pl">Polski</option></select></header><h1 data-t="title"></h1><p data-t="intro"></p><section><h2 data-t="local"></h2><label><span data-t="voice"></span><select id="voice"></select></label><button id="refresh" data-t="refresh"></button><div class="grid"><label><span data-t="rate"></span><input id="rate" type="number" min=".5" max="2" step=".1" value="1"></label><label><span data-t="pitch"></span><input id="pitch" type="number" min=".5" max="2" step=".1" value="1"></label></div><label><span data-t="script"></span><textarea id="script" maxlength="3000" rows="8"></textarea></label><button id="play" data-t="play" disabled></button><button id="stop" data-t="stop" disabled></button><button id="download" data-t="download"></button><p id="status" role="status"></p></section><section><h2 data-t="dub"></h2><p data-t="hint"></p><p data-t="limit"></p><label><span data-t="speaker"></span><input id="speaker" maxlength="80"></label><div class="grid"><label><span data-t="start"></span><input id="start" type="number" min="0" max="86400" step=".001" value="0"></label><label><span data-t="end"></span><input id="end" type="number" min="0" max="86400" step=".001" value="5"></label></div><label><span data-t="line"></span><textarea id="line" maxlength="500" rows="3"></textarea></label><button id="add" data-t="add"></button><button id="export" data-t="export" disabled></button><button id="clear" data-t="clear"></button><p id="dubStatus" role="status"></p><div id="lines"></div></section><section><h2 data-t="desktop"></h2><p data-t="guide"></p><div id="commands"></div><a href="https://ffmpeg.org/download.html" target="_blank" rel="noopener noreferrer">FFmpeg</a></section></main><script src="/voice-studio.js"></script></body></html>
