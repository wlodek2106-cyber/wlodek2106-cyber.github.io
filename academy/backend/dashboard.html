<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZER0LIFE Academy | Student</title><style>body{background:#10111b;color:#eee;font:16px system-ui;max-width:800px;margin:40px auto;padding:20px}section,article{background:#1b1d2d;border:1px solid #34364c;border-radius:14px;padding:18px;margin:12px 0}input,button{padding:12px;border-radius:8px;margin:5px;max-width:90%}button{background:#a78bfa;color:#151124;border:0;font-weight:bold}button:disabled{opacity:.4}small{color:#aaa}pre{white-space:pre-wrap}</style><label for="lang">Language / Язык</label> <select id="lang"><option value="en">English</option><option value="ru">Русский</option><option value="uk">Українська</option><option value="pl">Polski</option></select><h1>ZER0LIFE / ACADEMY</h1><p>Student dashboard · 30 days</p><section id="auth"><form id="login"><input name="email" type="email" required placeholder="Email"><input name="password" type="password" required placeholder="Password"><button>Sign in</button></form></section><p id="status" role="status"></p><section id="panel" hidden><button id="logout">Sign out</button><button id="admin">Admin statistics</button><button id="certificate">Claim certificate</button><article id="extra" hidden></article><section id="checkout"><h2>Course checkout</h2><select id="plan"><option value="starter">Starter — 199 USDC</option><option value="pro">Professional — 499 USDC</option><option value="vip">VIP — 999 USDC</option></select><button id="invoiceCreate">Create invoice</button><p id="invoiceInfo"></p><a id="payLink" hidden>Open Solana Pay</a><form id="confirmPayment" hidden><input name="signature" required maxlength="88" placeholder="Transaction signature"><button>Verify payment</button></form></section><h2>My learning</h2><div id="days"></div><article id="lesson" hidden></article></section><script>
let token="";const $=id=>document.getElementById(id);
async function api(path,body){const r=await fetch(path,{method:body?"POST":"GET",headers:{"Content-Type":"application/json",Authorization:"Bearer "+token},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw Error(d.error||"Unavailable");return d}
async function progress(){const p=await api("/progress");$("checkout").hidden=p.paid;$("days").replaceChildren();for(const l of p.lessons){const b=document.createElement("button");b.textContent="Day "+l.day+" · "+(l.completed?"Completed":l.unlocked?"Open":"Locked");b.disabled=!l.unlocked;b.onclick=async()=>{try{const d=await api("/lessons/"+l.day);$("lesson").hidden=false;$("lesson").textContent=[d.title,...(d.sections||[d.theory,d.assignment]),...(d.prompts||[])].join("\n\n");$("lesson").style.whiteSpace="pre-wrap";for(const [mode,label] of [["review","Tutor · Review"],["practice","Mentor · Practice"]]){const btn=document.createElement("button");btn.textContent=label;btn.onclick=async()=>{try{const g=await api("/tutor",{day:l.day,mode});$("extra").hidden=false;$("extra").textContent=[label,JSON.stringify(g.material||g.assignment,null,2),...g.steps].join("\n\n");$("extra").style.whiteSpace="pre-wrap"}catch(e){$("status").textContent=e.message}};$("lesson").append(btn)}if(!l.completed){const exam=document.createElement("button");exam.textContent="Start exam";exam.onclick=()=>startExam(l.day);$("lesson").append(document.createElement("hr"),exam)}}catch(e){$("status").textContent=e.message}};$("days").append(b)}}
$("login").onsubmit=async e=>{e.preventDefault();try{const f=new FormData(e.target);token=(await api("/login",{email:f.get("email"),password:f.get("password")})).token;await progress();$("auth").hidden=true;$("panel").hidden=false;$("status").textContent=""}catch(e){token="";$("status").textContent=e.message}};
$("logout").onclick=async()=>{try{await api("/logout",{})}catch(e){}token="";location.reload()};
async function startExam(day){try{const a=await api("/exams/start",{day});const form=document.createElement("form");for(const q of a.questions){const field=document.createElement("fieldset");const legend=document.createElement("legend");legend.textContent=q.question;field.append(legend);q.options.forEach((o,i)=>{const label=document.createElement("label"),input=document.createElement("input");input.type="radio";input.name=q.id;input.value=i;input.required=true;label.append(input,document.createTextNode(o));field.append(label,document.createElement("br"))});form.append(field)}const submit=document.createElement("button");submit.textContent="Submit exam";form.append(submit);form.onsubmit=async e=>{e.preventDefault();submit.disabled=true;try{const answers=Object.fromEntries([...new FormData(form)].map(([k,v])=>[k,Number(v)]));const r=await api("/exams/submit",{day,attempt_id:a.attempt_id,answers});$("status").textContent=r.score+"% — "+(r.passed?"Passed. Next lesson: "+(r.next_unlock_at||"Course complete"):"Try again");await progress();$("lesson").hidden=true}catch(e){$("status").textContent=e.message;submit.disabled=false}};$("lesson").replaceChildren(form)}catch(e){$("status").textContent=e.message}}
$("admin").onclick=async()=>{try{const d=await api("/admin/statistics");$("extra").hidden=false;$("extra").textContent=JSON.stringify(d,null,2);$("extra").style.whiteSpace="pre-wrap"}catch(e){$("status").textContent=e.message}};
$("certificate").onclick=async()=>{try{const d=await api("/certificates/issue",{});$("extra").hidden=false;$("extra").textContent=d.program+" | "+d.code+" | "+d.issued_at}catch(e){$("status").textContent=e.message}};
const translations={en:["Sign in","Sign out","Admin statistics","Claim certificate","My learning","Email","Password"],ru:["Войти","Выйти","Статистика","Получить сертификат","Моё обучение","Электронная почта","Пароль"],uk:["Увійти","Вийти","Статистика","Отримати сертифікат","Моє навчання","Електронна пошта","Пароль"],pl:["Zaloguj","Wyloguj","Statystyki","Odbierz certyfikat","Moja nauka","E-mail","Hasło"]};
function translateUI(){const lang=$("lang").value;const t=translations[lang];document.documentElement.lang=lang;document.querySelector("#login button").textContent=t[0];["logout","admin","certificate"].forEach((id,i)=>$(id).textContent=t[i+1]);document.querySelector("#panel > h2").textContent=t[4];document.querySelector("[name=email]").placeholder=t[5];document.querySelector("[name=password]").placeholder=t[6];}
$("lang").onchange=translateUI;
let invoiceId=null;
$("invoiceCreate").onclick=async()=>{try{const d=await api("/checkout/create",{plan:$("plan").value});if(!d.url.startsWith("solana:"))throw Error("Invalid payment link");invoiceId=d.id;$("payLink").href=d.url;$("payLink").hidden=false;$("confirmPayment").hidden=false;$("invoiceInfo").textContent="Expires: "+d.expires_at+" | "+(d.amount_atomic/1000000)+" USDC";}catch(e){$("status").textContent=e.message}};
$("confirmPayment").onsubmit=async e=>{e.preventDefault();try{await api("/checkout/confirm",{invoice:invoiceId,signature:new FormData(e.target).get("signature")});$("status").textContent="Payment verified";await progress()}catch(e){$("status").textContent=e.message}};
</script></html>
