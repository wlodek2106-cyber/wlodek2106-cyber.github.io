function renderLearningWidget(p){const w=$("learningWidget");w.hidden=!p.paid;if(!p.paid)return;const t={en:["Learning progress","lessons completed","Continue learning","Next lesson is locked","Course completed"],ru:["Прогресс обучения","уроков пройдено","Продолжить обучение","Следующий урок пока закрыт","Курс завершён"],uk:["Прогрес навчання","уроків пройдено","Продовжити навчання","Наступний урок поки закритий","Курс завершено"],pl:["Postęp nauki","ukończonych lekcji","Kontynuuj naukę","Następna lekcja jest zablokowana","Kurs ukończony"]}[$("lang").value];const n=p.lessons.filter(x=>x.completed).length,total=p.lessons.length,percent=Math.round(100*n/total),next=p.lessons.find(x=>!x.completed);$("widgetPlan").textContent=p.plan.toUpperCase();$("widgetTitle").textContent=t[0];$("widgetPercent").textContent=percent+"%";$("widgetProgress").value=percent;$("widgetDetail").textContent=n+" / "+total+" "+t[1]+(!next?" · "+t[4]:!next.unlocked?" · "+t[3]:"");const b=$("widgetContinue");b.hidden=!next||!next.unlocked;b.textContent=t[2]+(next?" · "+next.day:"");b.onclick=()=>{const target=document.querySelector('#days button[data-day="'+next.day+'"]');if(target){target.click();$("lesson").scrollIntoView({behavior:"smooth"})}}}
