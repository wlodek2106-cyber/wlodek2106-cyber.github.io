<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZER0LIFE Academy | Student</title><style>body{background:#10111b;color:#eee;font:16px system-ui;max-width:800px;margin:40px auto;padding:20px}section,article{background:#1b1d2d;border:1px solid #34364c;border-radius:14px;padding:18px;margin:12px 0}input,button{padding:12px;border-radius:8px;margin:5px;max-width:90%}button{background:#a78bfa;color:#151124;border:0;font-weight:bold}button:disabled{opacity:.4}small{color:#aaa}pre{white-space:pre-wrap}</style><h1>ZER0LIFE / ACADEMY</h1><p>Student dashboard · 30 days</p><section id="auth"><form id="login"><input name="email" type="email" required placeholder="Email"><input name="password" type="password" required placeholder="Password"><button>Sign in</button></form></section><p id="status" role="status"></p><section id="panel" hidden><button id="logout">Sign out</button><h2>My learning</h2><div id="days"></div><article id="lesson" hidden></article></section><script>
let token="";const $=id=>document.getElementById(id);
async function api(path,body){const r=await fetch(path,{method:body?"POST":"GET",headers:{"Content-Type":"application/json",Authorization:"Bearer "+token},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw Error(d.error||"Unavailable");return d}
async function progress(){const p=await api("/progress");$("days").replaceChildren();for(const l of p.lessons){const b=document.createElement("button");b.textContent="Day "+l.day+" · "+(l.completed?"Completed":l.unlocked?"Open":"Locked");b.disabled=!l.unlocked;b.onclick=async()=>{try{const d=await api("/lessons/"+l.day);$("lesson").hidden=false;$("lesson").textContent=[d.title,...(d.sections||[d.theory,d.assignment]),...(d.prompts||[])].join("\n\n");$("lesson").style.whiteSpace="pre-wrap"}catch(e){$("status").textContent=e.message}};$("days").append(b)}}
$("login").onsubmit=async e=>{e.preventDefault();try{const f=new FormData(e.target);token=(await api("/login",{email:f.get("email"),password:f.get("password")})).token;await progress();$("auth").hidden=true;$("panel").hidden=false;$("status").textContent=""}catch(e){token="";$("status").textContent=e.message}};
$("logout").onclick=async()=>{try{await api("/logout",{})}catch(e){}token="";location.reload()};
</script></html>
