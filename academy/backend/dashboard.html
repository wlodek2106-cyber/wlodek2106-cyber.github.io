<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZER0LIFE Academy | Student</title><style>body{background:#10111b;color:#eee;font:16px system-ui;max-width:800px;margin:40px auto;padding:20px}section,article{background:#1b1d2d;border:1px solid #34364c;border-radius:14px;padding:18px;margin:12px 0}input,button{padding:12px;border-radius:8px;margin:5px;max-width:90%}button{background:#a78bfa;color:#151124;border:0;font-weight:bold}button:disabled{opacity:.4}small{color:#aaa}pre{white-space:pre-wrap}</style><label for="lang">Language / Язык</label> <select id="lang"><option value="en">English</option><option value="ru">Русский</option><option value="uk">Українська</option><option value="pl">Polski</option></select><h1>ZER0LIFE / ACADEMY</h1><p>Student dashboard · 30 days</p><section id="auth"><form id="login"><input name="email" type="email" required placeholder="Email"><input name="password" type="password" required placeholder="Password"><button>Sign in</button></form><form id="register"><h2>Create account</h2><input name="first_name" required maxlength="100" placeholder="First name" autocomplete="given-name"><input name="last_name" required maxlength="100" placeholder="Last name" autocomplete="family-name"><input name="email" type="email" required maxlength="254" placeholder="Email" autocomplete="email"><input name="password" type="password" required minlength="12" maxlength="128" placeholder="Password (12+ characters)" autocomplete="new-password"><button>Create account</button></form></section><form id="verifyCert"><input name="code" required maxlength="128" placeholder="Certificate verification code"><button>Verify certificate</button><output id="verifyResult"></output></form><p id="status" role="status"></p><section id="panel" hidden><button id="logout">Sign out</button><button id="admin">Admin statistics</button><button id="certificate">Claim certificate</button><article id="extra" hidden></article><section id="checkout"><h2>Course checkout</h2><select id="plan"><option value="starter">Starter — 199 USDC</option><option value="pro">Professional — 499 USDC</option><option value="vip">VIP — 999 USDC</option></select><button id="invoiceCreate">Create invoice</button><p id="invoiceInfo"></p><img id="paymentQR" hidden alt="Scan with Solana wallet" width="240" height="240" style="background:white;padding:8px"><a id="payLink" hidden>Open Solana Pay</a><button id="discoverPayment" hidden>Check payment automatically</button><form id="confirmPayment" hidden><input name="signature" required maxlength="88" placeholder="Transaction signature"><button>Verify payment</button></form></section><h2>My learning</h2><div id="days"></div><article id="lesson" hidden></article></section><script>
let token="";const $=id=>document.getElementById(id);
async function api(path,body){const r=await fetch(path,{method:body?"POST":"GET",headers:{"Content-Type":"application/json",Authorization:"Bearer "+token},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw Error(d.error||"Unavailable");return d}
const uiWords={en:["Day","Completed","Open","Locked","Start exam","Tutor · Review","Mentor · Practice","Submit exam","Create account","First name","Last name","Course checkout","Create invoice"],ru:["День","Пройден","Доступен","Закрыт","Начать экзамен","Тьютор · Повторение","Ментор · Практика","Сдать экзамен","Создать аккаунт","Имя","Фамилия","Оплата курса","Создать счёт"],uk:["День","Пройдено","Доступно","Закрито","Почати іспит","Тьютор · Повторення","Ментор · Практика","Здати іспит","Створити акаунт","Ім’я","Прізвище","Оплата курсу","Створити рахунок"],pl:["Dzień","Ukończono","Dostępne","Zablokowane","Rozpocznij egzamin","Tutor · Powtórka","Mentor · Praktyka","Zakończ egzamin","Utwórz konto","Imię","Nazwisko","Płatność za kurs","Utwórz fakturę"]};const word=i=>uiWords[$("lang").value][i];
async function progress(){const p=await api("/progress");$("checkout").hidden=p.paid;$("days").replaceChildren();for(const l of p.lessons){const b=document.createElement("button");b.textContent=word(0)+" "+l.day+" · "+word(l.completed?1:l.unlocked?2:3);b.disabled=!l.unlocked;b.onclick=async()=>{try{const d=await api("/lessons/"+l.day);$("lesson").hidden=false;$("lesson").textContent=[d.title,...(d.sections||[d.theory,d.assignment]),...(d.prompts||[])].join("\n\n");$("lesson").style.whiteSpace="pre-wrap";for(const [mode,label] of [["review",word(5)],["practice",word(6)]]){const btn=document.createElement("button");btn.textContent=label;btn.onclick=async()=>{try{const g=await api("/tutor",{day:l.day,mode});$("extra").hidden=false;$("extra").textContent=[label,JSON.stringify(g.material||g.assignment,null,2),...g.steps].join("\n\n");$("extra").style.whiteSpace="pre-wrap"}catch(e){$("status").textContent=e.message}};$("lesson").append(btn)}if(!l.completed){const exam=document.createElement("button");exam.textContent=word(4);exam.onclick=()=>startExam(l.day);$("lesson").append(document.createElement("hr"),exam)}}catch(e){$("status").textContent=e.message}};$("days").append(b)}}
$("login").onsubmit=async e=>{e.preventDefault();try{const f=new FormData(e.target);token=(await api("/login",{email:f.get("email"),password:f.get("password")})).token;await progress();await restoreInvoice();$("auth").hidden=true;$("panel").hidden=false;$("status").textContent=""}catch(e){token="";$("status").textContent=e.message}};
$("logout").onclick=async()=>{try{await api("/logout",{})}catch(e){}token="";location.reload()};
async function startExam(day){try{const a=await api("/exams/start",{day});const form=document.createElement("form");for(const q of a.questions){const field=document.createElement("fieldset");const legend=document.createElement("legend");legend.textContent=q.question;field.append(legend);q.options.forEach((o,i)=>{const label=document.createElement("label"),input=document.createElement("input");input.type="radio";input.name=q.id;input.value=i;input.required=true;label.append(input,document.createTextNode(o));field.append(label,document.createElement("br"))});form.append(field)}const submit=document.createElement("button");submit.textContent=word(7);form.append(submit);form.onsubmit=async e=>{e.preventDefault();submit.disabled=true;try{const answers=Object.fromEntries([...new FormData(form)].map(([k,v])=>[k,Number(v)]));const r=await api("/exams/submit",{day,attempt_id:a.attempt_id,answers});$("status").textContent=r.score+"% — "+(r.passed?"Passed. Next lesson: "+(r.next_unlock_at||"Course complete"):"Try again");await progress();$("lesson").hidden=true;if(r.certificate){$("status").textContent="Course complete! Your certificate is ready.";$("certificate").click()}}catch(e){$("status").textContent=e.message;submit.disabled=false}};$("lesson").replaceChildren(form)}catch(e){$("status").textContent=e.message}}
$("admin").onclick=async()=>{try{const d=await api("/admin/statistics");$("extra").hidden=false;$("extra").textContent=JSON.stringify(d,null,2);$("extra").style.whiteSpace="pre-wrap"}catch(e){$("status").textContent=e.message}};
$("verifyCert").onsubmit=async e=>{e.preventDefault();try{const res=await fetch("/certificates/verify",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({code:e.target.elements.code.value.trim()})});const d=await res.json();$("verifyResult").textContent=res.ok?(d.valid?"Valid completion record · "+d.issued_at:"Certificate not found"):"Verification unavailable"}catch(e){$("verifyResult").textContent="Verification unavailable"}};
$("certificate").onclick=async()=>{try{const d=await api("/certificates/issue",{});$("extra").hidden=false;$("extra").replaceChildren();const heading=document.createElement("h2");heading.textContent="Certificate of completion";const details=document.createElement("p");details.textContent=d.program+" | "+d.code+" | "+d.issued_at;const name=document.createElement("input");name.value=d.recipient_name;name.readOnly=true;const print=document.createElement("button");print.textContent="Print / Save as PDF";print.onclick=()=>{const n=name.value.trim();if(!n){name.focus();return}const w=window.open("","_blank");if(!w){$("status").textContent="Allow pop-ups to print";return}const doc=w.document;doc.title="ZER0LIFE Academy Certificate";const style=doc.createElement("style");style.textContent="@page{size:A4 landscape;margin:15mm}body{font:18px Georgia,serif;color:#172033;text-align:center}main{border:5px double #98733d;padding:35px;margin:20px}h1{font-size:42px}h2{font-size:32px}small{overflow-wrap:anywhere}";doc.head.append(style);const main=doc.createElement("main");for(const [tag,value] of [["p","ZER0LIFE AI CREATOR ACADEMY"],["h1","Certificate of Completion"],["p","Presented to"],["h2",n],["p",d.program],["p","30 lessons completed · Issued "+d.issued_at.slice(0,10)],["small","Verification code: "+d.code],["p","Verify at zer0life-academy.onrender.com (certificate code)"]]){const el=doc.createElement(tag);el.textContent=value;main.append(el)}doc.body.append(main);w.focus();w.print()};const download=document.createElement("button");download.textContent="Download PDF";download.onclick=async()=>{try{const data=await api("/certificates/pdf");const bytes=Uint8Array.from(atob(data.pdf_base64),c=>c.charCodeAt(0));const url=URL.createObjectURL(new Blob([bytes],{type:"application/pdf"}));const a=document.createElement("a");a.href=url;a.download="ZER0LIFE-Certificate.pdf";a.click();setTimeout(()=>URL.revokeObjectURL(url),10000)}catch(e){$("status").textContent=e.message}};$("extra").append(heading,details,name,download,print)}catch(e){$("status").textContent=e.message}};
const translations={en:["Sign in","Sign out","Admin statistics","Claim certificate","My learning","Email","Password"],ru:["Войти","Выйти","Статистика","Получить сертификат","Моё обучение","Электронная почта","Пароль"],uk:["Увійти","Вийти","Статистика","Отримати сертифікат","Моє навчання","Електронна пошта","Пароль"],pl:["Zaloguj","Wyloguj","Statystyki","Odbierz certyfikat","Moja nauka","E-mail","Hasło"]};
function translateUI(){const lang=$("lang").value;const t=translations[lang];document.documentElement.lang=lang;document.querySelector("#login button").textContent=t[0];["logout","admin","certificate"].forEach((id,i)=>$(id).textContent=t[i+1]);document.querySelector("#panel > h2").textContent=t[4];document.querySelector("[name=email]").placeholder=t[5];document.querySelector("[name=password]").placeholder=t[6];document.querySelector("#register h2").textContent=word(8);document.querySelector("#register button").textContent=word(8);document.querySelector("[name=first_name]").placeholder=word(9);document.querySelector("[name=last_name]").placeholder=word(10);document.querySelector("#checkout h2").textContent=word(11);$("invoiceCreate").textContent=word(12);}
$("lang").onchange=()=>{localStorage.setItem("academyLanguage",$("lang").value);translateUI();if(!$("panel").hidden)progress().catch(e=>$("status").textContent=e.message)};const savedLanguage=localStorage.getItem("academyLanguage");if(uiWords[savedLanguage])$("lang").value=savedLanguage;translateUI();
let invoiceId=null;
$("invoiceCreate").onclick=async()=>{try{const d=await api("/checkout/create",{plan:$("plan").value});if(!d.url.startsWith("solana:"))throw Error("Invalid payment link");invoiceId=d.id;startPaymentPolling(d.expires_at);loadPaymentQR();$("payLink").href=d.url;$("payLink").hidden=false;$("confirmPayment").hidden=false;$("discoverPayment").hidden=false;$("invoiceInfo").textContent="Expires: "+d.expires_at+" | "+(d.amount_atomic/1000000)+" USDC";}catch(e){$("status").textContent=e.message}};
$("confirmPayment").onsubmit=async e=>{e.preventDefault();try{await api("/checkout/confirm",{invoice:invoiceId,signature:new FormData(e.target).get("signature")});$("status").textContent="Payment verified";await progress()}catch(e){$("status").textContent=e.message}};
$("register").onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector("button");b.disabled=true;try{const f=new FormData(e.target);await api("/register",{email:f.get("email"),password:f.get("password"),first_name:f.get("first_name"),last_name:f.get("last_name")});$("status").textContent="Account created. Please sign in.";e.target.reset()}catch(err){$("status").textContent=err.message}finally{b.disabled=false}};
$("discoverPayment").onclick=async()=>{const b=$("discoverPayment");b.disabled=true;try{const d=await api("/checkout/discover",{invoice:invoiceId});$("status").textContent=d.paid?"Payment verified":"Awaiting finalized payment";if(d.paid)await progress()}catch(e){$("status").textContent=e.message}finally{b.disabled=false}};
let paymentTimer=null;
function startPaymentPolling(expiry){
 clearInterval(paymentTimer);
 const deadline=Date.parse(expiry)+120000;
 paymentTimer=setInterval(async()=>{
 if(!token||Date.now()>deadline||$("checkout").hidden){clearInterval(paymentTimer);return}
 if(document.hidden||$("discoverPayment").disabled)return;
 await $("discoverPayment").onclick();
 },30000);
}
async function restoreInvoice(){try{const d=(await api("/checkout/active")).invoice;if(!d||!d.url.startsWith("solana:"))return;invoiceId=d.id;$("payLink").href=d.url;$("payLink").hidden=false;$("confirmPayment").hidden=false;$("discoverPayment").hidden=false;$("invoiceInfo").textContent="Expires: "+d.expires_at+" | "+(d.amount_atomic/1000000)+" USDC";startPaymentPolling(d.expires_at);loadPaymentQR()}catch(e){$("status").textContent=e.message}}
async function loadPaymentQR(){try{const d=await api("/checkout/qr");$("paymentQR").src="data:image/svg+xml;base64,"+d.svg_base64;$("paymentQR").hidden=false}catch(e){$("paymentQR").hidden=true}}
</script></html>
