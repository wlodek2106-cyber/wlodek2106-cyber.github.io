<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src blob: data:; media-src blob:; connect-src 'none'; base-uri 'none'; form-action 'none'"><title>ZER0LIFE · Animation Studio</title><style>*{box-sizing:border-box}body{margin:0;background:#090a12;color:#efedff;font:16px/1.5 system-ui}main{max-width:1050px;margin:auto;padding:24px 16px}header{display:flex;gap:12px;align-items:center;flex-wrap:wrap}a{color:#c7b6ff}section{background:#151624;border:1px solid #37354b;border-radius:18px;padding:16px;margin:16px 0}label{display:block;margin:8px 0}input,textarea,select,button{font:inherit;padding:9px;min-height:44px;border-radius:8px;max-width:100%}label input,label textarea,label select{display:block;width:100%;background:#0d0f1b;color:#eee;border:1px solid #44445a}button{background:#b5a4ff;color:#171229;border:0;font-weight:700;margin:5px;cursor:pointer}button:disabled{opacity:.45}canvas,video{display:block;max-width:100%;height:auto;max-height:65vh;margin:auto;background:#000}p,small{color:#b9b9cf}[hidden]{display:none!important}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}</style></head><body><main><header><strong>ZER0LIFE / ANIMATION</strong><a href="/dashboard">Academy</a><a href="/creator-suite">Creator Suite</a><select id="lang" aria-label="Language"><option value="en">English</option><option value="ru">Русский</option><option value="uk">Українська</option><option value="pl">Polski</option></select></header><h1>Video &amp; Animation Studio</h1><p data-t="0"></p><section><label><span data-t="1"></span><input id="images" type="file" multiple accept="image/png,image/jpeg,image/webp"></label><p id="files"></p><label><span data-t="2"></span><textarea id="captions" rows="4" maxlength="1200"></textarea></label><div class="grid"><label><sp
