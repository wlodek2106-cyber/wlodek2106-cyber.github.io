name: Academy web smoke checks
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'academy/backend/**'
      - 'academy/tests/**'
      - 'academy/ops/**'
      - '.github/workflows/academy-web-check.yml'
permissions:
  contents: read
concurrency:
  group: academy-web-check
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python compilation and unit tests
        run: |
          bash -n academy/ops/backup.sh
          bash -n academy/ops/verify_restore.sh
          python -m compileall -q academy/backend
          cd academy/backend
          python -m unittest -v test_progression test_http_boundary
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runtime
        working-directory: academy/tests
        run: |
          npm install --no-save --no-package-lock playwright@1.51.1
          npx playwright install --with-deps chromium
      - name: Browser smoke test (mocked API, no payments)
        run: node academy/tests/browser_smoke.cjs

      - name: Automation studio unit tests
        run: node academy/tests/automation_unit.cjs

      - name: Website builder unit tests
        run: node academy/tests/website_unit.cjs

      - name: Music studio unit tests
        run: node academy/tests/music_unit.cjs

      - name: Animation studio unit tests
        run: node academy/tests/animation_unit.cjs

      - name: Local agent team unit tests
        run: node academy/tests/agent_team.cjs

      - name: Marketing export unit tests
        run: node academy/tests/marketing_export.cjs

      - name: Local media browser smoke test
        run: node academy/tests/media_smoke.cjs

      - name: Voice studio browser smoke test
        run: node academy/tests/voice_smoke.cjs

      - name: Design studio browser smoke test
        run: node academy/tests/design_smoke.cjs

      - name: Encrypted backup and restore (synthetic data only)
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          cid="$(docker run -d --network none -e POSTGRES_HOST_AUTH_METHOD=trust postgres:17)"
          trap 'docker rm -fv "$cid" >/dev/null 2>&1 || true; rm -rf "$tmp"' EXIT
          for i in $(seq 1 60); do
            if docker exec "$cid" pg_isready -h 127.0.0.1 -U postgres >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec "$cid" pg_isready -h 127.0.0.1 -U postgres
          docker exec "$cid" createdb -U postgres academy_test
          docker exec "$cid" psql -v ON_ERROR_STOP=1 -U postgres -d academy_test -c "CREATE SCHEMA academy; CREATE TABLE academy.students(id int); CREATE TABLE academy.enrollments(id int); CREATE TABLE academy.payment_invoices(id int); CREATE TABLE academy.lesson_progress(id int); INSERT INTO academy.students VALUES (1);"
          export ACADEMY_TEST_CONTAINER="$cid"
          export GNUPGHOME="$tmp/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          mkdir "$tmp/bin"
          printf '%s\n' '#!/usr/bin/env bash' 'exec docker exec "$ACADEMY_TEST_CONTAINER" pg_dump -U postgres -d academy_test "$@"' > "$tmp/bin/pg_dump"
          printf '%s\n' '#!/usr/bin/env bash' 'exec /usr/bin/gpg --batch --yes --pinentry-mode loopback --passphrase synthetic-test-only "$@"' > "$tmp/bin/gpg"
          chmod 700 "$tmp/bin/"*
          export PATH="$tmp/bin:$PATH"
          export ACADEMY_DATABASE_URL="synthetic-test-only"
          bash academy/ops/backup.sh "$tmp/backup"
          archive="$(find "$tmp/backup" -name '*.dump.gpg' -type f)"
          test -n "$archive"
          bash academy/ops/verify_restore.sh "$archive"
