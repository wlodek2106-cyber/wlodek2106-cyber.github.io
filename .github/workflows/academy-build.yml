name: Academy native builds
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/academy-build.yml'
concurrency:
  group: academy-native-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: academy/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify or install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK_ROOT" > local.properties
          if [[ -f "$SDK_ROOT/platforms/android-35/android.jar" && -d "$SDK_ROOT/build-tools/35.0.0" ]]; then
            echo "Android SDK 35 is already installed."
          else
            SDK_MANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
            if [[ ! -x "$SDK_MANAGER" ]]; then
              SDK_MANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
            fi
            test -x "$SDK_MANAGER"
            "$SDK_MANAGER" --sdk_root="$SDK_ROOT" 'platforms;android-35' 'build-tools;35.0.0'
          fi
          test -f "$SDK_ROOT/platforms/android-35/android.jar"
          test -d "$SDK_ROOT/build-tools/35.0.0"
      - run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: academy-android-debug
          path: academy/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet publish academy/windows/Academy.csproj -c Release -r win-x64 --self-contained true -o academy-output
      - uses: actions/upload-artifact@v4
        with:
          name: academy-windows-x64
          path: academy-output/
          if-no-files-found: error

  apple:
    runs-on: macos-15
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - scheme: Academy
            destination: generic/platform=iOS Simulator
          - scheme: AcademyMac
            destination: generic/platform=macOS
          - scheme: AcademyWatch
            destination: generic/platform=watchOS Simulator
    defaults:
      run:
        working-directory: academy/apple
    steps:
      - uses: actions/checkout@v4
      - run: command -v xcodegen || brew install xcodegen
      - run: xcodegen generate
      - run: xcodebuild -project Zer0LifeAcademy.xcodeproj -scheme '${{ matrix.scheme }}' -destination '${{ matrix.destination }}' CODE_SIGNING_ALLOWED=NO build
