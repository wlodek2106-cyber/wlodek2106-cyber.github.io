name: Academy payment program prototype
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'academy/solana-payment-program/**'
      - '.github/workflows/academy-payment-program.yml'
permissions:
  contents: read
jobs:
  host-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: academy/solana-payment-program
    steps:
      - uses: actions/checkout@v4
      - name: Check Rust toolchain
        run: rustc --version && cargo --version
      - name: Compile and run host unit tests only
        run: cargo test --lib

  local-runtime-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: academy/solana-payment-program
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
      - name: Run isolated native Solana bank runtime tests
        run: cargo test --features runtime-tests --test runtime -- --nocapture

  lab-sbf-build:
    # Only after both native test jobs pass. Not a mainnet deployment artifact.
    needs: [host-tests, local-runtime-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: academy/solana-payment-program
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned SBF build utility
        run: cargo install cargo-build-sbf --version 4.2.0 --locked
      - name: Generate and record a dependency lock for this experiment
        run: cargo generate-lockfile
      - name: Compile laboratory SBF and record binary metadata
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/zer0life-sbf-private"
          report="$RUNNER_TEMP/zer0life-sbf-report"
          mkdir -p "$out" "$report"
          cargo build-sbf --version | tee "$report/toolchain.txt"
          cargo build-sbf --tools-version v1.56 --sbf-out-dir "$out" -- --locked
          binary="$out/zer0life_payment_prototype.so"
          test -s "$binary"
          readelf -h "$binary" > "$report/elf-header.txt"
          sha256sum "$binary" | sed 's@  .*@  zer0life_payment_prototype.so@' > "$report/SHA256SUMS"
          cp "$binary" "$report/zer0life_payment_prototype.so"
          cp Cargo.lock "$report/Cargo.lock"
          printf '%s\n' "$GITHUB_SHA" > "$report/source-commit.txt"
          printf '%s\n' 'LAB ONLY: no deployment, no mainnet compatibility claim, no audited reproducibility.' > "$report/NOT-FOR-DEPLOYMENT.txt"
          # The build tool may generate a local program keypair. Never upload it.
      - name: Upload only public lab binary and metadata
        uses: actions/upload-artifact@v4
        with:
          name: zer0life-payment-lab-sbf
          path: |
            ${{ runner.temp }}/zer0life-sbf-report/zer0life_payment_prototype.so
            ${{ runner.temp }}/zer0life-sbf-report/Cargo.lock
            ${{ runner.temp }}/zer0life-sbf-report/toolchain.txt
            ${{ runner.temp }}/zer0life-sbf-report/elf-header.txt
            ${{ runner.temp }}/zer0life-sbf-report/SHA256SUMS
            ${{ runner.temp }}/zer0life-sbf-report/source-commit.txt
            ${{ runner.temp }}/zer0life-sbf-report/NOT-FOR-DEPLOYMENT.txt
          if-no-files-found: error
          retention-days: 7

  lab-sbf-execution:
    needs: [lab-sbf-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: academy/solana-payment-program
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_BUILD_JOBS: '2'
      ZER0LIFE_TEST_SBF: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Download this run's public laboratory binary
        uses: actions/download-artifact@v4
        with:
          name: zer0life-payment-lab-sbf
          path: ${{ runner.temp }}/zer0life-sbf-execution
      - name: Validate artifact and execute compiled SBF in isolated bank
        shell: bash
        run: |
          set -euo pipefail
          lab="$RUNNER_TEMP/zer0life-sbf-execution"
          test "$(cat "$lab/source-commit.txt")" = "$GITHUB_SHA"
          (cd "$lab" && sha256sum --strict -c SHA256SUMS)
          cp "$lab/Cargo.lock" Cargo.lock
          BPF_OUT_DIR="$lab" cargo test --locked --features runtime-tests --test runtime -- --nocapture 2>&1 | tee "$RUNNER_TEMP/sbf-execution.txt"
          grep -Fq 'ZER0LIFE execution mode: compiled SBF' "$RUNNER_TEMP/sbf-execution.txt"
      - name: Preserve test result without private keys
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zer0life-payment-lab-execution-log
          path: ${{ runner.temp }}/sbf-execution.txt
          if-no-files-found: warn
          retention-days: 7
