name: Academy contract integration lab
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'academy/contract-integration-lab/**'
      - '.github/workflows/academy-contract-integration-lab.yml'
permissions:
  contents: read
jobs:
  offline-abi:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated lab SDK
        run: python -m pip install --only-binary=:all: -r academy/contract-integration-lab/requirements.txt
      - name: Test PDA and unsigned transaction ABI
        working-directory: academy/contract-integration-lab
        env:
          PYTHONPATH: ../backend
        run: python -m unittest -v test_contract_lab
